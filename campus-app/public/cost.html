<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotus Campus — Cost estimate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="index.html">Lotus Campus</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Campus</a>
        <a href="index.html#calendar">Calendar</a>
        <a href="index.html#deadlines">Deadlines</a>
        <a href="index.html#courses">Courses</a>
        <a href="partners.html?id=1">Partners</a>
        <a class="active" aria-current="page" href="cost.html">Cost</a>
        <a href="plan.html?id=1">Plan</a>
        <a href="profile.html?id=1">Profile</a>
        <span class="auth-actions" id="auth-actions">
          <a id="login-link" href="login.html">Log in</a>
          <a id="signup-link" href="signup.html">Sign up</a>
          <a id="logout-link" href="index.html" hidden>Log out</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">Cost estimate</h1>
    <form id="cost-form" class="card">
      <div class="field"><label for="study-days">Study days per week</label><input id="study-days" name="study_days_per_week" type="number" min="0" max="7" step="1" value="3"></div>
      <div class="field"><label for="printed-pages">Printed pages per month</label><input id="printed-pages" name="printed_pages_per_month" type="number" min="0" max="500" step="1" value="40"></div>
      <div class="field"><label for="campus-trips">Campus trips per week</label><input id="campus-trips" name="campus_trips_per_week" type="number" min="0" max="14" step="1" value="6"></div>
      <div class="field"><label for="coffees">Coffees per week</label><input id="coffees" name="coffees_per_week" type="number" min="0" max="14" step="1" value="3"></div>
      <button class="btn primary" type="submit">Calculate</button>
    </form>

    <section class="card" aria-live="polite">
      <p id="status" class="alert info" role="status"></p>
      <p class="muted">Estimate only. Prices are approximate and will be updated.</p>
      <h2 id="total">Total: —</h2>
      <div id="breakdown"></div>
    </section>
  </main>
  <script>
    const form = document.getElementById('cost-form');
    const status = document.getElementById('status');
    const total = document.getElementById('total');
    const breakdown = document.getElementById('breakdown');
    const fields = Array.from(form.querySelectorAll('input'));

    function showError(message) {
      status.textContent = message;
      status.className = 'alert error';
      total.textContent = 'Total: —';
      breakdown.replaceChildren();
    }

    function renderBreakdown(items) {
      breakdown.replaceChildren();
      const table = document.createElement('table');
      table.className = 'table';
      const head = document.createElement('thead');
      const headerRow = document.createElement('tr');
      ['Category', 'Quantity', 'Amount'].forEach(function (heading) {
        const cell = document.createElement('th');
        cell.textContent = heading;
        headerRow.appendChild(cell);
      });
      head.appendChild(headerRow);
      table.appendChild(head);

      const body = document.createElement('tbody');
      items.forEach(function (item) {
        const row = document.createElement('tr');
        [item.label, item.quantity, item.amount_azn + ' AZN'].forEach(function (value) {
          const cell = document.createElement('td');
          cell.textContent = String(value);
          row.appendChild(cell);
        });
        body.appendChild(row);
      });
      table.appendChild(body);
      breakdown.appendChild(table);
    }

    async function calculate(event) {
      if (event) event.preventDefault();
      const params = new URLSearchParams();
      fields.forEach(function (field) {
        params.set(field.name, field.value);
      });
      status.textContent = 'Calculating...';
      status.className = '';
      try {
        const response = await fetch('/.netlify/functions/cost-estimate?' + params.toString());
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || 'Cost request failed');
        status.textContent = '';
        total.textContent = 'Total: ' + body.total_azn + ' AZN';
        renderBreakdown(body.breakdown);
      } catch (err) {
        showError('Could not load the cost estimate.');
      }
    }

    form.addEventListener('submit', calculate);
    fields.forEach(function (field) {
      field.addEventListener('change', calculate);
    });
    calculate();
  </script>
  <script src="js/header-auth.js"></script>
</body>
</html>
