<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotus Campus — AI study plan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="index.html">Lotus Campus</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Campus</a>
        <a href="index.html#calendar">Calendar</a>
        <a href="index.html#deadlines">Deadlines</a>
        <a href="index.html#courses">Courses</a>
        <a href="partners.html?id=1">Partners</a>
        <a href="cost.html">Cost</a>
        <a class="active" aria-current="page" href="plan.html?id=1">Plan</a>
        <a href="profile.html?id=1">Profile</a>
        <span class="auth-actions" id="auth-actions">
          <a id="login-link" href="login.html">Log in</a>
          <a id="signup-link" href="signup.html">Sign up</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">AI study plan</h1>
    <button class="btn primary" id="generate" type="button">Generate plan</button>
    <section class="card" aria-live="polite">
      <p id="status" class="alert info" role="status" aria-live="polite">Loading saved plan...</p>
      <p id="source" class="badge">Loading source...</p>
      <p id="summary" class="empty-state">Loading summary...</p>
      <div id="plan"><p class="empty-state">Loading weeks...</p></div>
    </section>
  </main>
  <script src="js/app-shell.js"></script>
  <script type="module" src="js/plan-page.js" defer></script>
  <script src="js/header-auth.js"></script>
</body>
</html>
