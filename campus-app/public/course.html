<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotus Campus — Course details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header"><div class="page header-inner"><a class="brand" href="index.html">Lotus Campus</a><nav class="site-nav" aria-label="Main navigation"><a href="index.html">Campus</a><a href="schedule.html">Schedule</a><a class="active" aria-current="page" href="courses.html">Courses</a><a href="partners.html?id=1">Partners</a><a href="cost.html">Cost</a><a href="plan.html?id=1">Plan</a><a href="profile.html?id=1">Profile</a><span class="auth-actions" id="auth-actions"><a id="login-link" href="login.html">Log in</a><a id="signup-link" href="signup.html">Sign up</a></span></nav></div></header>
  <main class="page">
    <h1 class="page-title">Course details</h1>
    <p id="status" class="alert info">Loading course...</p>
    <div id="course-content" hidden>
      <div class="course-heading card"><h2 id="course-title" class="card-title"></h2><p id="course-meta" class="muted"></p></div>
      <div class="course-tabs" role="tablist" aria-label="Course details">
        <button class="btn secondary course-tab" id="overview-tab" type="button" role="tab" aria-selected="true" aria-controls="overview-panel" tabindex="0">Overview</button>
        <button class="btn secondary course-tab" id="materials-tab" type="button" role="tab" aria-selected="false" aria-controls="materials-panel" tabindex="-1">Materials</button>
        <button class="btn secondary course-tab" id="assignments-tab" type="button" role="tab" aria-selected="false" aria-controls="assignments-panel" tabindex="-1">Assignments</button>
        <button class="btn secondary course-tab" id="syllabus-tab" type="button" role="tab" aria-selected="false" aria-controls="syllabus-panel" tabindex="-1">Syllabus</button>
      </div>
      <section id="overview-panel" class="course-panel card" role="tabpanel" aria-labelledby="overview-tab"><div id="overview-content"><p class="empty-state">Loading overview...</p></div></section>
      <section id="materials-panel" class="course-panel card" role="tabpanel" aria-labelledby="materials-tab" hidden><div id="materials-content"><p class="empty-state">Loading materials...</p></div></section>
      <section id="assignments-panel" class="course-panel card" role="tabpanel" aria-labelledby="assignments-tab" hidden><div id="assignments-content"><p class="empty-state">Loading assignments...</p></div></section>
      <section id="syllabus-panel" class="course-panel card" role="tabpanel" aria-labelledby="syllabus-tab" hidden><div id="syllabus-content"><p class="empty-state">Loading syllabus...</p></div></section>
      <section class="card sample-card" aria-labelledby="groups-title"><div class="section-heading"><h2 id="groups-title" class="card-title">Related groups</h2><span class="badge">Sample</span></div><p class="muted">Related course groups will appear here in a future phase.</p></section>
    </div>
  </main>
  <script src="js/app-shell.js"></script>
  <script type="module">
    import { formatBakuDateTime } from './js/dates.js';
    function showMessage(container, message, isError) { container.replaceChildren(); const paragraph = document.createElement('p'); paragraph.textContent = message; paragraph.className = isError ? 'alert error' : 'empty-state'; container.appendChild(paragraph); }
    function safeHttpUrl(value) { try { const url = new URL(value); return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null; } catch (error) { return null; } }
    function setTab(tab, tabs, panels) { tabs.forEach(function (item) { const active = item === tab; item.setAttribute('aria-selected', String(active)); item.tabIndex = active ? 0 : -1; }); panels.forEach(function (panel) { panel.hidden = panel.getAttribute('aria-labelledby') !== tab.id; }); }
    function setupTabs() { const tabs = Array.from(document.querySelectorAll('.course-tab')); const panels = Array.from(document.querySelectorAll('.course-panel')); tabs.forEach(function (tab, index) { tab.addEventListener('click', function () { setTab(tab, tabs, panels); }); tab.addEventListener('keydown', function (event) { if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(event.key)) return; event.preventDefault(); let next = index; if (event.key === 'ArrowRight') next = (index + 1) % tabs.length; if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length; if (event.key === 'Home') next = 0; if (event.key === 'End') next = tabs.length - 1; tabs[next].focus(); setTab(tabs[next], tabs, panels); }); }); }
    function textNode(tag, value, className) { const node = document.createElement(tag); if (className) node.className = className; node.textContent = value == null ? '' : String(value); return node; }
    function renderOverview(course) { document.getElementById('course-title').textContent = (course.name || '') + ' (' + (course.code || '') + ')'; document.getElementById('course-meta').textContent = 'Teacher: ' + String(course.teacher || '—') + ' · Room: ' + String(course.room || '—'); const target = document.getElementById('overview-content'); target.replaceChildren(); const list = document.createElement('dl'); list.className = 'detail-list'; [['Course', (course.name || '') + ' (' + (course.code || '') + ')'], ['Teacher', course.teacher || '—'], ['Room', course.room || '—'], ['Schedule', course.schedule_text || 'No schedule details available.']].forEach(function (entry) { list.append(textNode('dt', entry[0]), textNode('dd', entry[1])); }); target.appendChild(list); }
    function renderMaterials(files) { const target = document.getElementById('materials-content'); target.replaceChildren(); const materialFiles = (files || []).filter(function (file) { return file.kind === 'syllabus' || file.kind === 'presentation'; }); if (!materialFiles.length) { showMessage(target, 'No materials found.'); return; } const groups = { syllabus: [], presentation: [] }; materialFiles.forEach(function (file) { groups[file.kind].push(file); }); Object.keys(groups).forEach(function (kind) { if (!groups[kind].length) return; target.appendChild(textNode('h3', kind === 'syllabus' ? 'Syllabus materials' : 'Presentations')); const list = document.createElement('ul'); groups[kind].forEach(function (file) { const item = document.createElement('li'); const safeUrl = safeHttpUrl(file.url); if (safeUrl) { const link = document.createElement('a'); link.href = safeUrl; link.textContent = file.title || 'Untitled file'; item.appendChild(link); } else item.textContent = file.title || 'Untitled file'; list.appendChild(item); }); target.appendChild(list); }); }
    function renderAssignments(deadlines) { const target = document.getElementById('assignments-content'); target.replaceChildren(); if (!deadlines || !deadlines.length) { showMessage(target, 'No assignments found.'); return; } const list = document.createElement('ul'); deadlines.slice().sort(function (a, b) { return new Date(a.due_at) - new Date(b.due_at); }).forEach(function (deadline) { const item = document.createElement('li'); const due = new Date(deadline.due_at); const days = Number.isNaN(due.getTime()) ? 'Days left unavailable' : Math.ceil((due.getTime() - Date.now()) / 86400000) + ' days left'; item.append(textNode('strong', deadline.title || 'Assignment'), textNode('span', String(deadline.type || 'Deadline') + ' · ' + (formatBakuDateTime(deadline.due_at) || 'Due time unavailable') + ' · ' + days, 'muted')); list.appendChild(item); }); target.appendChild(list); }
    function renderSyllabus(course) { const target = document.getElementById('syllabus-content'); target.replaceChildren(); if (!course.syllabus) { showMessage(target, 'No syllabus available.'); return; } target.appendChild(textNode('p', course.syllabus, 'pre-wrap')); }
    async function loadCourse() { const status = document.getElementById('status'); const content = document.getElementById('course-content'); const courseId = new URLSearchParams(window.location.search).get('id'); setupTabs(); if (!courseId) { status.textContent = 'A valid course id is required.'; status.className = 'alert error'; return; } try { const response = await fetch('/api/course?id=' + encodeURIComponent(courseId)); const body = await response.json().catch(function () { return {}; }); if (response.status === 404) { status.textContent = 'Course not found.'; status.className = 'alert error'; return; } if (!response.ok) throw new Error('Course request failed'); const course = body.course || {}; renderOverview(course); renderMaterials(body.files); renderAssignments(body.deadlines); renderSyllabus(course); content.hidden = false; status.textContent = 'Course loaded.'; status.className = 'alert success'; } catch (error) { status.textContent = 'Could not load the course.'; status.className = 'alert error'; ['overview-content', 'materials-content', 'assignments-content', 'syllabus-content'].forEach(function (id) { showMessage(document.getElementById(id), 'Could not load this tab.', true); }); } }
    loadCourse();
  </script>
  <script src="js/header-auth.js"></script>
</body>
</html>
