<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotus Campus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="index.html">Lotus Campus</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="active" aria-current="page" href="index.html">Campus</a>
        <a href="index.html#calendar">Calendar</a>
        <a href="index.html#deadlines">Deadlines</a>
        <a href="index.html#courses">Courses</a>
        <a href="partners.html?id=1">Partners</a>
        <a href="cost.html">Cost</a>
        <a href="plan.html?id=1">Plan</a>
        <a href="profile.html?id=1">Profile</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">Lotus Campus</h1>
    <p id="status" class="alert info">Loading...</p>
    <div class="grid">
      <section class="card">
        <h2 class="card-title">Demo Students</h2>
        <div id="students"><p class="empty-state">Loading students...</p></div>
      </section>

      <section id="courses" class="card">
        <h2 class="card-title">Courses</h2>
        <div id="courses-list"><p class="empty-state">Loading courses...</p></div>
      </section>

      <section id="deadlines" class="card">
        <h2 class="card-title">Deadlines</h2>
        <div id="deadlines-list"><p class="empty-state">Loading deadlines...</p></div>
      </section>

      <section id="calendar" class="card">
        <h2 class="card-title">Weekly schedule</h2>
        <div id="schedule-list"><p class="empty-state">Loading weekly schedule...</p></div>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
