<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotus Campus — Study partners</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="index.html">Lotus Campus</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Campus</a>
        <a href="index.html#calendar">Calendar</a>
        <a href="index.html#deadlines">Deadlines</a>
        <a href="index.html#courses">Courses</a>
        <a class="active" aria-current="page" href="partners.html?id=1">Partners</a>
        <a href="cost.html">Cost</a>
        <a href="plan.html?id=1">Plan</a>
        <a href="profile.html?id=1">Profile</a>
        <span class="auth-actions" id="auth-actions">
          <a id="login-link" href="login.html">Log in</a>
          <a id="signup-link" href="signup.html">Sign up</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">Study partners</h1>
    <p id="status" class="alert info">Loading study partners...</p>
    <div id="partners-list" class="grid"><p class="empty-state">Loading study partners...</p></div>
  </main>
  <script src="js/app-shell.js"></script>
  <script type="module">
    import { getSession } from './js/auth.js';

    function showMessage(container, message, isError) {
      container.replaceChildren();
      const paragraph = document.createElement('p');
      paragraph.textContent = message;
      paragraph.className = isError ? 'alert error' : 'empty-state';
      container.appendChild(paragraph);
    }

    function appendList(card, headingText, values, emptyText) {
      const heading = document.createElement('h3');
      heading.textContent = headingText;
      card.appendChild(heading);
      if (!values || values.length === 0) {
        const empty = document.createElement('p');
        empty.textContent = emptyText;
        card.appendChild(empty);
        return;
      }
      const list = document.createElement('ul');
      values.forEach(function (value) {
        const item = document.createElement('li');
        item.textContent = value;
        list.appendChild(item);
      });
      card.appendChild(list);
    }

    async function loadPartners() {
      const status = document.getElementById('status');
      const list = document.getElementById('partners-list');
      const id = new URLSearchParams(window.location.search).get('id') || '1';
      try {
        const session = await getSession().catch(function () { return null; });
        const headers = session ? { Authorization: 'Bearer ' + session.access_token } : {};
        const response = await fetch('/api/partners?user_id=' + encodeURIComponent(id), { headers });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || 'Partner request failed');
        if (body.length === 0) {
          status.textContent = 'Study partners';
          showMessage(list, 'No study partners found yet.');
          return;
        }

        status.textContent = 'Study partners';
        list.replaceChildren();
        body.forEach(function (partner) {
          const card = document.createElement('article');
          card.className = 'card partner-card';
          const name = document.createElement('h2');
          name.textContent = partner.name;
          card.appendChild(name);
          const year = document.createElement('p');
          year.textContent = 'Year ' + partner.year;
          card.appendChild(year);
          appendList(card, 'Shared courses', partner.shared_courses, 'No shared courses.');
          appendList(card, 'Free times in common', partner.overlapping_free_times, 'No overlapping free times.');
          list.appendChild(card);
        });
      } catch (err) {
        status.textContent = 'Study partners';
        showMessage(list, 'Could not load study partners.', true);
      }
    }
    loadPartners();
  </script>
  <script src="js/header-auth.js"></script>
</body>
</html>
