<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · Lotus Campus</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/lotus-badge.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header"><div class="page header-inner"><a class="brand" href="index.html">Lotus Campus</a><nav class="site-nav" aria-label="Main navigation"><a href="index.html">Campus</a><a href="courses.html">Courses</a><a href="schedule.html">Schedule</a><a class="active" aria-current="page" href="events.html">Events</a><span class="auth-actions" id="auth-actions"><a id="login-link" href="login.html">Log in</a><a id="signup-link" href="signup.html">Sign up</a></span></nav></div></header>
  <main class="page">
    <h1 class="page-title">Events</h1>
    <p id="events-status" class="alert info">Loading upcoming events...</p>
    <section id="events-list-view" aria-labelledby="events-list-title">
      <h2 id="events-list-title" class="sr-only">Upcoming events</h2>
      <div id="events-list"><p class="empty-state">Loading upcoming events...</p></div>
    </section>
    <section id="event-detail-view" class="card" hidden aria-labelledby="event-detail-title">
      <a class="btn secondary" href="events.html">Back to events</a>
      <div id="event-detail-content"><p class="empty-state">Loading event...</p></div>
    </section>
  </main>
  <script src="js/app-shell.js"></script>
  <script type="module" src="js/events-page.js" defer></script>
  <script src="js/header-auth.js"></script>
</body>
</html>
