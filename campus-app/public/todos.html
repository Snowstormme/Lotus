<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do · Lotus Campus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="index.html">Lotus Campus</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Campus</a>
        <span class="auth-actions" id="auth-actions"><a id="login-link" href="login.html">Log in</a><a id="signup-link" href="signup.html">Sign up</a></span>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">To-do</h1>
    <section class="card" aria-labelledby="add-todo-title">
      <h2 id="add-todo-title" class="card-title">Add a task</h2>
      <form id="todo-form">
        <div class="field">
          <label for="todo-title">Task title</label>
          <input id="todo-title" name="title" maxlength="200" required>
        </div>
        <div class="field">
          <label for="todo-due">Due date (optional)</label>
          <input id="todo-due" name="due_at" type="date">
        </div>
        <div class="field">
          <label for="todo-deadline">Link to a deadline (optional)</label>
          <select id="todo-deadline" name="deadline_id">
            <option value="">Loading deadlines...</option>
          </select>
        </div>
        <button id="todo-add" class="btn primary" type="submit">Add</button>
      </form>
      <p id="todo-form-status" class="empty-state" role="status"></p>
    </section>
    <section class="card" aria-labelledby="open-todos-title">
      <h2 id="open-todos-title" class="card-title">Open</h2>
      <div id="open-todos"><p class="empty-state">Loading tasks...</p></div>
    </section>
    <section class="card" aria-labelledby="done-todos-title">
      <h2 id="done-todos-title" class="card-title">Done</h2>
      <div id="done-todos"><p class="empty-state">Loading tasks...</p></div>
    </section>
  </main>
  <script src="js/app-shell.js"></script>
  <script type="module" src="js/todos-page.js" defer></script>
  <script src="js/header-auth.js"></script>
</body>
</html>
