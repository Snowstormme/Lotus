<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotus Campus — Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="index.html">Lotus Campus</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Campus</a>
        <a href="index.html#calendar">Calendar</a>
        <a href="index.html#deadlines">Deadlines</a>
        <a href="index.html#courses">Courses</a>
        <a href="partners.html?id=1">Partners</a>
        <a href="cost.html">Cost</a>
        <a href="plan.html?id=1">Plan</a>
        <a class="active" aria-current="page" href="profile.html?id=1">Profile</a>
        <span class="auth-actions" id="auth-actions">
          <a id="login-link" href="login.html">Log in</a>
          <a id="signup-link" href="signup.html">Sign up</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">Profile</h1>
    <p class="alert info">Demo mode: only the demo student can be edited. Real accounts come in the next phase.</p>
    <p id="load-status" class="alert info">Loading profile...</p>
    <form id="profile-form" class="card" hidden>
      <section>
        <h2 class="card-title">Profile details</h2>
        <div class="field"><label for="name">Name</label><input id="name" type="text" readonly></div>
        <div class="field"><label for="university">University</label><input id="university" type="text" readonly></div>
        <div class="field"><label for="faculty">Faculty</label><input id="faculty" type="text" readonly></div>
        <div class="field"><label for="year">Year (1 to 6)</label><input id="year" type="number" min="1" max="6" step="1" required></div>
        <div class="field"><label for="languages">Languages (maximum 50 characters)</label><input id="languages" type="text" maxlength="50" required></div>
        <div class="field"><label for="weekly-free-hours">Weekly free hours (0 to 60)</label><input id="weekly-free-hours" type="number" min="0" max="60" step="1" required></div>
      </section>

      <section>
        <h2 class="card-title">Weekly availability</h2>
        <div id="availability-editor"></div>
      </section>

      <button class="btn primary" type="submit">Save profile</button>
      <p id="save-status" class="alert" role="status"></p>
    </form>
    <section class="card">
      <h2 class="card-title">Account</h2>
      <button id="profile-logout" class="btn secondary" type="button">Log out</button>
      <p id="logout-status" class="alert" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="js/app-shell.js"></script>
  <script type="module">
    import { getSession } from './js/auth.js';

    const weekdays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const timePattern = /^(?:[01]\d|2[0-3]):[0-5]\d$/;

    function showMessage(container, message, isError) {
      container.textContent = message;
      container.className = isError ? 'alert error' : 'alert success';
    }

    function addSlot(dayIndex, values) {
      const slots = document.querySelector('[data-slots="' + dayIndex + '"]');
      const row = document.createElement('div');
      row.className = 'availability-slot';
      row.dataset.weekday = dayIndex;

      const start = document.createElement('input');
      start.type = 'time';
      start.value = values && values.start_time ? String(values.start_time).slice(0, 5) : '';
      const startLabel = document.createElement('label');
      startLabel.textContent = 'Start';
      startLabel.appendChild(start);
      const startField = document.createElement('span');
      startField.className = 'field';
      startField.appendChild(startLabel);

      const end = document.createElement('input');
      end.type = 'time';
      end.value = values && values.end_time ? String(values.end_time).slice(0, 5) : '';
      const endLabel = document.createElement('label');
      endLabel.textContent = 'End';
      endLabel.appendChild(end);
      const endField = document.createElement('span');
      endField.className = 'field';
      endField.appendChild(endLabel);

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = 'Remove';
      remove.addEventListener('click', function () {
        row.remove();
      });

      row.appendChild(startField);
      row.appendChild(endField);
      row.appendChild(remove);
      slots.appendChild(row);
    }

    function buildAvailabilityEditor(slots) {
      const editor = document.getElementById('availability-editor');
      editor.replaceChildren();
      weekdays.forEach(function (weekday, dayIndex) {
        const day = document.createElement('div');
        day.className = 'availability-day';
        const heading = document.createElement('h3');
        heading.textContent = weekday;
        day.appendChild(heading);

        const slotList = document.createElement('div');
        slotList.dataset.slots = dayIndex;
        day.appendChild(slotList);

        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'add-slot';
        add.textContent = 'Add slot';
        add.addEventListener('click', function () {
          addSlot(dayIndex);
        });
        day.appendChild(add);
        editor.appendChild(day);

        const daySlots = (slots || []).filter(function (slot) {
          return slot.weekday === dayIndex;
        });
        if (daySlots.length === 0) addSlot(dayIndex);
        daySlots.forEach(function (slot) {
          addSlot(dayIndex, slot);
        });
      });
    }

    function collectSlots() {
      const slots = [];
      let invalid = false;
      document.querySelectorAll('.availability-slot').forEach(function (row) {
        const start = row.querySelector('input[type="time"]');
        const end = row.querySelectorAll('input[type="time"]')[1];
        if (!start.value && !end.value) return;
        if (!timePattern.test(start.value) || !timePattern.test(end.value) || end.value <= start.value) {
          invalid = true;
          return;
        }
        slots.push({
          weekday: Number(row.dataset.weekday),
          start_time: start.value,
          end_time: end.value
        });
      });
      if (slots.length > 14) invalid = true;
      return invalid ? null : slots;
    }

    async function loadProfile() {
      const loadStatus = document.getElementById('load-status');
      const form = document.getElementById('profile-form');
      const id = new URLSearchParams(window.location.search).get('id') || '1';
      try {
        const session = await getSession().catch(function () { return null; });
        const authHeaders = session ? { Authorization: 'Bearer ' + session.access_token } : {};
        const [profileResponse, availabilityResponse] = await Promise.all([
          fetch('/api/profile?id=' + encodeURIComponent(id), { headers: authHeaders }),
          fetch('/api/availability?user_id=' + encodeURIComponent(id), { headers: authHeaders })
        ]);
        const profile = await profileResponse.json().catch(() => ({}));
        const availability = await availabilityResponse.json().catch(() => []);
        if (profileResponse.status === 404 || availabilityResponse.status === 404) {
          showMessage(loadStatus, 'Demo user not found.', true);
          return;
        }
        if (!profileResponse.ok || !availabilityResponse.ok) throw new Error('Profile request failed');

        document.getElementById('name').value = profile.name || '';
        document.getElementById('university').value = profile.university || '';
        document.getElementById('faculty').value = profile.faculty || '';
        document.getElementById('year').value = profile.year;
        document.getElementById('languages').value = profile.languages || '';
        document.getElementById('weekly-free-hours').value = profile.weekly_free_hours;
        buildAvailabilityEditor(availability);
        loadStatus.textContent = 'Profile loaded.';
        form.hidden = false;
      } catch (err) {
        showMessage(loadStatus, 'Could not load the profile.', true);
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      const saveStatus = document.getElementById('save-status');
      const year = Number(document.getElementById('year').value);
      const languages = document.getElementById('languages').value;
      const weeklyFreeHours = Number(document.getElementById('weekly-free-hours').value);
      const slots = collectSlots();
      if (!Number.isInteger(year) || year < 1 || year > 6 || languages.length > 50 || /[\r\n]/.test(languages) ||
          !Number.isInteger(weeklyFreeHours) || weeklyFreeHours < 0 || weeklyFreeHours > 60 || slots === null) {
        showMessage(saveStatus, 'Please enter valid profile and availability values.', true);
        return;
      }

      const id = new URLSearchParams(window.location.search).get('id') || '1';
      try {
        const session = await getSession().catch(function () { return null; });
        const authHeaders = session ? { Authorization: 'Bearer ' + session.access_token } : {};
        const [profileResponse, availabilityResponse] = await Promise.all([
          fetch('/api/profile?id=' + encodeURIComponent(id), {
            method: 'PUT',
            headers: { ...authHeaders, 'Content-Type': 'application/json' },
            body: JSON.stringify({ year, languages, weekly_free_hours: weeklyFreeHours })
          }),
          fetch('/api/availability?user_id=' + encodeURIComponent(id), {
            method: 'PUT',
            headers: { ...authHeaders, 'Content-Type': 'application/json' },
            body: JSON.stringify(slots)
          })
        ]);
        if (!profileResponse.ok || !availabilityResponse.ok) throw new Error('Save failed');
        showMessage(saveStatus, 'Profile and availability saved.');
      } catch (err) {
        showMessage(saveStatus, 'Could not save profile.', true);
      }
    });

    loadProfile();
  </script>
  <script type="module">
    import { signOut } from './js/auth.js';

    document.getElementById('profile-logout').addEventListener('click', async function () {
      const status = document.getElementById('logout-status');
      status.textContent = 'Signing out...';
      status.className = 'alert info';
      try {
        await signOut();
        window.location.replace('index.html');
      } catch (error) {
        status.textContent = 'Could not sign out. Please try again.';
        status.className = 'alert error';
      }
    });
  </script>
  <script src="js/header-auth.js"></script>
</body>
</html>
