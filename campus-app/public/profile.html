<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    form { max-width: 720px; }
    label { display: block; margin: 12px 0 4px; }
    input { padding: 6px; }
    input[readonly] { background: #f0f0f0; }
    .availability-day { margin: 16px 0; }
    .availability-day h3 { font-size: 15px; margin: 0 0 6px; }
    .availability-slot { align-items: center; display: flex; gap: 8px; margin: 6px 0; }
    .availability-slot button, .add-slot { padding: 4px 8px; }
    #save-status { min-height: 1.5em; }
  </style>
</head>
<body>
  <header>
    <h1>Profile</h1>
    <nav><a href="index.html#courses">Back to courses</a></nav>
  </header>
  <main>
    <p>Demo mode: only the demo student can be edited. Real accounts come in the next phase.</p>
    <p id="load-status">Loading profile...</p>
    <form id="profile-form" hidden>
      <section>
        <h2>Profile details</h2>
        <label for="name">Name</label>
        <input id="name" type="text" readonly>

        <label for="university">University</label>
        <input id="university" type="text" readonly>

        <label for="faculty">Faculty</label>
        <input id="faculty" type="text" readonly>

        <label for="year">Year (1 to 6)</label>
        <input id="year" type="number" min="1" max="6" step="1" required>

        <label for="languages">Languages (maximum 50 characters)</label>
        <input id="languages" type="text" maxlength="50" required>

        <label for="weekly-free-hours">Weekly free hours (0 to 60)</label>
        <input id="weekly-free-hours" type="number" min="0" max="60" step="1" required>
      </section>

      <section>
        <h2>Weekly availability</h2>
        <div id="availability-editor"></div>
      </section>

      <button type="submit">Save profile</button>
      <p id="save-status" role="status"></p>
    </form>
  </main>
  <script>
    const weekdays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const timePattern = /^(?:[01]\d|2[0-3]):[0-5]\d$/;

    function showMessage(container, message, isError) {
      container.textContent = message;
      container.className = isError ? 'error' : '';
    }

    function addSlot(dayIndex, values) {
      const slots = document.querySelector('[data-slots="' + dayIndex + '"]');
      const row = document.createElement('div');
      row.className = 'availability-slot';
      row.dataset.weekday = dayIndex;

      const start = document.createElement('input');
      start.type = 'time';
      start.setAttribute('aria-label', weekdays[dayIndex] + ' start time');
      start.value = values && values.start_time ? String(values.start_time).slice(0, 5) : '';

      const end = document.createElement('input');
      end.type = 'time';
      end.setAttribute('aria-label', weekdays[dayIndex] + ' end time');
      end.value = values && values.end_time ? String(values.end_time).slice(0, 5) : '';

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = 'Remove';
      remove.addEventListener('click', function () {
        row.remove();
      });

      row.appendChild(start);
      row.appendChild(document.createTextNode(' to '));
      row.appendChild(end);
      row.appendChild(remove);
      slots.appendChild(row);
    }

    function buildAvailabilityEditor(slots) {
      const editor = document.getElementById('availability-editor');
      editor.replaceChildren();
      weekdays.forEach(function (weekday, dayIndex) {
        const day = document.createElement('div');
        day.className = 'availability-day';
        const heading = document.createElement('h3');
        heading.textContent = weekday;
        day.appendChild(heading);

        const slotList = document.createElement('div');
        slotList.dataset.slots = dayIndex;
        day.appendChild(slotList);

        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'add-slot';
        add.textContent = 'Add slot';
        add.addEventListener('click', function () {
          addSlot(dayIndex);
        });
        day.appendChild(add);
        editor.appendChild(day);

        const daySlots = (slots || []).filter(function (slot) {
          return slot.weekday === dayIndex;
        });
        if (daySlots.length === 0) addSlot(dayIndex);
        daySlots.forEach(function (slot) {
          addSlot(dayIndex, slot);
        });
      });
    }

    function collectSlots() {
      const slots = [];
      let invalid = false;
      document.querySelectorAll('.availability-slot').forEach(function (row) {
        const start = row.querySelector('input[type="time"]');
        const end = row.querySelectorAll('input[type="time"]')[1];
        if (!start.value && !end.value) return;
        if (!timePattern.test(start.value) || !timePattern.test(end.value) || end.value <= start.value) {
          invalid = true;
          return;
        }
        slots.push({
          weekday: Number(row.dataset.weekday),
          start_time: start.value,
          end_time: end.value
        });
      });
      if (slots.length > 14) invalid = true;
      return invalid ? null : slots;
    }

    async function loadProfile() {
      const loadStatus = document.getElementById('load-status');
      const form = document.getElementById('profile-form');
      const id = new URLSearchParams(window.location.search).get('id') || '1';
      try {
        const [profileResponse, availabilityResponse] = await Promise.all([
          fetch('/.netlify/functions/profile?id=' + encodeURIComponent(id)),
          fetch('/.netlify/functions/availability?user_id=' + encodeURIComponent(id))
        ]);
        const profile = await profileResponse.json().catch(() => ({}));
        const availability = await availabilityResponse.json().catch(() => []);
        if (profileResponse.status === 404 || availabilityResponse.status === 404) {
          showMessage(loadStatus, 'Demo user not found.', true);
          return;
        }
        if (!profileResponse.ok || !availabilityResponse.ok) throw new Error('Profile request failed');

        document.getElementById('name').value = profile.name || '';
        document.getElementById('university').value = profile.university || '';
        document.getElementById('faculty').value = profile.faculty || '';
        document.getElementById('year').value = profile.year;
        document.getElementById('languages').value = profile.languages || '';
        document.getElementById('weekly-free-hours').value = profile.weekly_free_hours;
        buildAvailabilityEditor(availability);
        loadStatus.textContent = 'Profile loaded.';
        form.hidden = false;
      } catch (err) {
        showMessage(loadStatus, 'Could not load the profile.', true);
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      const saveStatus = document.getElementById('save-status');
      const year = Number(document.getElementById('year').value);
      const languages = document.getElementById('languages').value;
      const weeklyFreeHours = Number(document.getElementById('weekly-free-hours').value);
      const slots = collectSlots();
      if (!Number.isInteger(year) || year < 1 || year > 6 || languages.length > 50 || /[\r\n]/.test(languages) ||
          !Number.isInteger(weeklyFreeHours) || weeklyFreeHours < 0 || weeklyFreeHours > 60 || slots === null) {
        showMessage(saveStatus, 'Please enter valid profile and availability values.', true);
        return;
      }

      const id = new URLSearchParams(window.location.search).get('id') || '1';
      try {
        const [profileResponse, availabilityResponse] = await Promise.all([
          fetch('/.netlify/functions/profile?id=' + encodeURIComponent(id), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ year, languages, weekly_free_hours: weeklyFreeHours })
          }),
          fetch('/.netlify/functions/availability?user_id=' + encodeURIComponent(id), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(slots)
          })
        ]);
        if (!profileResponse.ok || !availabilityResponse.ok) throw new Error('Save failed');
        showMessage(saveStatus, 'Profile and availability saved.');
      } catch (err) {
        showMessage(saveStatus, 'Could not save profile.', true);
      }
    });

    loadProfile();
  </script>
</body>
</html>
