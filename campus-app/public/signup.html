<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotus Campus — Sign up</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/lotus-badge.svg" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="index.html">Lotus Campus</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Campus</a>
        <a href="index.html#calendar">Calendar</a>
        <a href="index.html#deadlines">Deadlines</a>
        <a href="index.html#courses">Courses</a>
        <a href="profile.html?id=1">Profile</a>
        <span class="auth-actions" id="auth-actions">
          <a id="login-link" href="login.html">Log in</a>
          <a class="active" aria-current="page" id="signup-link" href="signup.html">Sign up</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="page">
    <img class="auth-logo" src="img/lotus-badge.svg" alt="" aria-hidden="true" focusable="false">
    <h1 class="page-title">Sign up</h1>
    <form id="signup-form" class="card">
      <div class="field">
        <label for="full-name">Full name</label>
        <input id="full-name" name="full_name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password (minimum 8 characters)</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn primary" type="submit">Create account</button>
      <p id="message" class="alert" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/header-auth.js"></script>
  <script src="js/signup-page.js" defer></script>
</body>
</html>
